<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>1%CLUB VIP DINNER — Invitation</title>
<meta property="og:title" content="1%CLUB VIP DINNER">
<meta property="og:description" content="DECRYPTING… 2026. 8. 28 FRI 8PM–10:30PM">
<meta name="theme-color" content="#050a07">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sun-typeface/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--grn:#4ade80;--grn-dim:#1d5c37;--bg:#050a07}
body{background:var(--bg);color:#c9f2d8;font-family:'SUIT Variable',sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.5;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px)}
.stage{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 22px}
.term{width:min(92vw,400px);border:1px solid #16442a;border-radius:12px;background:rgba(6,18,11,.85);
  box-shadow:0 24px 70px rgba(0,0,0,.7),0 0 40px rgba(74,222,128,.06);overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:10px 14px;border-bottom:1px solid #123822;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#3f8f5f;letter-spacing:.14em}
.bar i{width:8px;height:8px;border-radius:50%;background:#164a2b;display:inline-block}
.body{padding:22px 20px 26px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:2.1}
.ln{white-space:pre-wrap;word-break:break-all;color:#68c78d;min-height:1.6em}
.ln b{color:var(--grn);font-weight:500}
.ln .dim{color:#2e6b45}
.klabel{color:#2e6b45}
.logo{width:102px;margin:12px 0 4px;filter:drop-shadow(0 0 10px rgba(74,222,128,.35));opacity:0;transition:opacity .8s}
body.decoded .logo{opacity:1}
.kor{font-family:'SUIT Variable',sans-serif;color:#b7ebc8;font-size:13px;line-height:2;word-break:keep-all}
.cursor{display:inline-block;width:7px;height:14px;background:var(--grn);vertical-align:-2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{margin-top:26px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.3em;color:#2e6b45;text-transform:uppercase;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.rsvp-open{display:block;width:min(92vw,400px);margin:30px auto 0;padding:16px 0;border-radius:10px;
  background:transparent;border:1px solid var(--grn);color:var(--grn);font-family:'IBM Plex Mono',monospace;
  font-size:13px;letter-spacing:.3em;text-indent:.3em;cursor:pointer;transition:background .2s,color .2s}
.rsvp-open:active{background:rgba(74,222,128,.14)}
.sheet{position:fixed;inset:0;background:rgba(2,6,4,.8);backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:70}
.sheet.on{display:flex}
.panel{width:100%;max-width:480px;background:#07130c;border:1px solid #1a5232;border-bottom:none;
  border-radius:18px 18px 0 0;padding:30px 26px calc(30px + env(safe-area-inset-bottom));max-height:88svh;overflow-y:auto;animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.panel h2{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.4em;text-indent:.4em;color:var(--grn);text-align:center;margin-bottom:6px}
.panel .note{font-size:11.5px;color:#417c58;text-align:center;margin-bottom:22px;line-height:1.8}
.field{margin-bottom:16px}
.field label{display:block;font-size:10.5px;letter-spacing:.2em;color:#58a377;margin-bottom:7px}
.field input{width:100%;background:#0a1a10;border:1px solid #1a4d2e;border-radius:8px;padding:13px 14px;color:#d8f7e3;font-family:inherit;font-size:15px;outline:none}
.field input:focus{border-color:var(--grn)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice input{display:none}
.choice span{display:block;text-align:center;padding:13px 6px;border:1px solid #1a4d2e;border-radius:8px;font-size:13px;color:#6fbc8f;cursor:pointer}
.choice input:checked+span{border-color:var(--grn);color:#dcffe9;background:rgba(74,222,128,.12)}
.submit{width:100%;margin-top:8px;padding:16px 0;border-radius:8px;border:none;cursor:pointer;
  background:var(--grn);color:#04150b;font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:13px;letter-spacing:.3em;text-indent:.3em}
.close{display:block;margin:16px auto 0;background:none;border:none;color:#3c7754;font-size:11px;letter-spacing:.3em;cursor:pointer;font-family:inherit}
.done{text-align:center;padding:34px 0 20px;display:none}
.done .big{font-family:'IBM Plex Mono',monospace;font-size:17px;letter-spacing:.3em;color:var(--grn);margin-bottom:14px}
.done p{font-size:13px;color:#6fbc8f;line-height:2}
.foot{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.3em;color:#1e4a2e;padding-bottom:40px}

.rsvp-open{display:none}
body.rsvp-ready .rsvp-open{display:block;animation:rsvpin .9s ease}
@keyframes rsvpin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="term" id="term">
    <div class="bar"><i></i><i></i><i></i>&nbsp;1CLUB://SECURE-CHANNEL</div>
    <div class="body" id="tbody">
      <div class="ln dim" id="l0">&gt; incoming transmission…</div>
      <div class="ln" id="l1"></div>
      <div style="text-align:center"><img class="logo" src="../assets/logo-white.png" alt="1%CLUB"></div>
      <div class="ln" id="l2"></div>
      <div class="ln" id="l3"></div>
      <div class="ln" id="l4"></div>
      <div class="ln" id="l5"></div>
      <div class="ln" id="l6"></div>
      <div class="ln"><span class="cursor"></span></div>
    </div>
  </div>
  <div class="hint" id="hint">TAP TO DECRYPT</div>
  <button class="rsvp-open" onclick="openSheet()">[ SEND RSVP ]</button>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <div id="formWrap">
      <h2>RSVP</h2>
      <p class="note">좌석이 한정되어 있어 조기 마감될 수 있습니다.<br>아래 내용을 남겨주시면 확정 안내를 드립니다.</p>
      <form id="rsvp" action="https://docs.google.com/forms/d/e/1FAIpQLSddsV6gYgW3Kfnzry5Cp3gtOZDgGaNMDZUKG9sHznGi60rTkg/formResponse" method="POST" target="gframe">
        <div class="field"><label>이름</label>
          <input name="entry.1633263028" required autocomplete="name" placeholder="이름을 입력해주세요"></div>
        <div class="field"><label>성별</label>
          <div class="choice">
            <label><input type="radio" name="entry.1817100511" value="남" required><span>남</span></label>
            <label><input type="radio" name="entry.1817100511" value="여"><span>여</span></label>
          </div></div>
        <div class="field"><label>MBTI</label>
          <input name="entry.734525497" required placeholder="예: ENFP" maxlength="4" style="text-transform:uppercase"></div>
        <div class="field"><label>연락처</label>
          <input name="entry.826452057" required autocomplete="tel" inputmode="tel" placeholder="010-0000-0000"></div>
        <div class="field"><label>솔로 여부</label>
          <div class="choice">
            <label><input type="radio" name="entry.1556673927" value="솔로입니다" required><span>솔로입니다</span></label>
            <label><input type="radio" name="entry.1556673927" value="솔로가 아닙니다"><span>솔로가 아닙니다</span></label>
          </div></div>
        <div class="field"><label>(희망 시) 럭키드로우 협찬 희망 품목 <small style="letter-spacing:0;opacity:.6">(1인당 최대 2개)</small></label>
          <input name="entry.558269791" placeholder="협찬하실 품목 (최대 2개)"></div>
        <div class="field"><label>알레르기 · 못 드시는 음식 <small style="letter-spacing:0;opacity:.6">(선택)</small></label>
          <input name="entry.1174381968" placeholder="예: 갑각류 알레르기, 오이"></div>
        <div class="field"><label>대관 시간 확인 <small style="letter-spacing:0;opacity:.6">저녁 8시 ~ 밤 10시 30분 · 종료 시간 엄수</small></label>
          <div class="choice" style="grid-template-columns:1fr">
            <label><input type="radio" name="entry.961666042" value="네, 확인했습니다" required><span>네, 확인했습니다</span></label>
          </div></div>
        <div class="field"><label>교통 안내 <small style="letter-spacing:0;opacity:.6">주차가 어려운 지역이에요 — 대중교통을 부탁드립니다</small></label>
          <div class="choice" style="grid-template-columns:1fr">
            <label><input type="radio" name="entry.97358986" value="네, 대중교통으로 방문하겠습니다" required><span>네, 대중교통으로 방문하겠습니다</span></label>
          </div></div>
        <input type="hidden" name="entry.974406819" value="CIPHER">
        <button type="submit" class="submit">TRANSMIT</button></form>
      <button class="close" onclick="closeSheet()">닫기</button>
    </div>
    <div class="done" id="done">
      <div class="big">TRANSMITTED</div>
      <p>회신이 전달되었습니다.<br>확정 안내를 곧 보내드리겠습니다.</p>
      <button class="close" onclick="closeSheet()">닫기</button>
    </div>
  </div>
</div>
<iframe name="gframe" style="display:none"></iframe>
<div class="foot">1%CLUB · PRIVATE DINNER SERIES</div>

<script>
const CH="!<>-_\\/[]{}—=+*^?#________";
const LINES=[
  ["l1","> DECRYPTED: <b>YOU ARE INVITED</b>"],
  ["l2","<span class='klabel'>DATE</span>  <b>2026.08.28 FRI</b>"],
  ["l3","<span class='klabel'>TIME</span>  <b>20:00 – 22:30</b> <span class='dim'>(hard stop)</span>"],
  ["l4","<span class='klabel'>PLACE</span> <b>최선상회</b> — 서울 성동구 장터길 38-1"],
  ["l5","<span class='kor'>조용한 저녁, 한 자리를 비워두었습니다.</span>"],
  ["l6","<span class='klabel'>HOST</span>  <b>1%CLUB 김준형</b>"]
];
let started=false;
function scramble(el,html,dur){
  const tmp=document.createElement('div');tmp.innerHTML=html;
  const finalText=tmp.textContent;const t0=performance.now();
  (function tick(now){
    const p=Math.min(1,(now-t0)/dur);
    const n=Math.floor(finalText.length*p);
    let out=finalText.slice(0,n);
    for(let i=n;i<finalText.length;i++)out+=CH[Math.floor(Math.random()*CH.length)];
    el.textContent=out;
    if(p<1)requestAnimationFrame(tick);else el.innerHTML=html;
  })(t0);
}
document.getElementById('term').addEventListener('click',()=>{
  if(started)return;started=true;setTimeout(()=>document.body.classList.add('rsvp-ready'),3600);
  document.getElementById('hint').style.opacity=.2;
  document.getElementById('l0').textContent="> transmission received. decrypting…";
  LINES.forEach((L,i)=>setTimeout(()=>{
    scramble(document.getElementById(L[0]),L[1],700);
    if(i===0)document.body.classList.add('decoded');
  },350+i*520));
});
function openSheet(){document.getElementById('sheet').classList.add('on')}
function closeSheet(){document.getElementById('sheet').classList.remove('on')}
document.getElementById('rsvp').addEventListener('submit',()=>{
  setTimeout(()=>{document.getElementById('formWrap').style.display='none';
    document.getElementById('done').style.display='block';},600);
});

new MutationObserver(()=>{
  if(document.body.classList.contains('rsvp-ready')&&!window.__rsvpScrolled){
    window.__rsvpScrolled=true;
    setTimeout(()=>{const b=document.querySelector('.rsvp-open');
      if(b)b.scrollIntoView({behavior:'smooth',block:'center'});},1000);
  }
}).observe(document.body,{attributes:true,attributeFilter:['class']});
</script>
</body>
</html>
