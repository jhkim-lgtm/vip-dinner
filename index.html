<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1%CLUB VIP DINNER — 초대장 시안 5종</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Noto+Serif+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0d10;color:#e9e3d4;font-family:'Noto Serif KR',serif;min-height:100svh;overflow-x:hidden;
 display:flex;flex-direction:column;align-items:center;padding:60px 22px 80px;
 background-image:radial-gradient(900px 600px at 50% -10%,#1a1a20 0%,#0d0d10 65%)}
img.logo{width:150px;margin-bottom:14px}
.sub{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.44em;text-indent:.44em;color:#8b8266;margin-bottom:8px}
h1{font-size:16px;font-weight:400;letter-spacing:.12em;color:#cfc8b4;margin-bottom:44px}
.list{width:100%;max-width:460px;display:grid;gap:14px}
a.item{display:flex;align-items:center;gap:18px;text-decoration:none;color:inherit;
 border:1px solid #2a2a30;border-radius:14px;padding:20px 22px;background:#141417;transition:border .2s}
a.item:hover{border-color:#c9a961}
.swatch{width:52px;height:52px;border-radius:10px;flex:none;border:1px solid rgba(255,255,255,.12)}
.s1{background:linear-gradient(140deg,#141418,#26210f);box-shadow:inset 0 0 0 1px rgba(201,169,97,.5)}
.s2{background:linear-gradient(140deg,#f6f1e6,#e3dac6);position:relative}
.s2::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#7a1f2b}
.s3{background:linear-gradient(120deg,#0e1420 40%,#4a95ff 75%,#b478ff 100%)}
.s4{background:radial-gradient(circle at 40% 35%,#3a161d,#1a0d10);position:relative}
.s4::after{content:"1%";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 font-family:'Cormorant Garamond',serif;font-size:15px;color:#c8a15a}
.s5{background:#f4f1ea;position:relative}
.s5::after{content:"V";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
 font-family:'Cormorant Garamond',serif;font-size:22px;color:#17150f}
.t{display:flex;flex-direction:column;gap:4px;min-width:0}
.t .d{word-break:keep-all}
.t .n{font-family:'Cormorant Garamond',serif;font-size:16px;letter-spacing:.24em}
.t .d{font-size:11.5px;color:#8f8874;line-height:1.7}
.foot{margin-top:52px;font-size:10px;letter-spacing:.3em;color:#4c4839;text-align:center;line-height:2.2}
</style>
</head>
<body>
<img class="logo" src="assets/logo-white.png" alt="1%CLUB">
<div class="sub">VIP DINNER · INVITATION DRAFTS</div>
<h1>초대장 시안 5종 — 최선상회 8/28</h1>
<div class="list">
  <a class="item" href="noir/"><span class="swatch s1"></span>
    <span class="t"><span class="n">01 · NOIR</span><span class="d">블랙카드 × 골드 포일 — 카드를 탭하면 3D로 뒤집힘</span></span></a>
  <a class="item" href="seal/"><span class="swatch s2"></span>
    <span class="t"><span class="n">02 · SEAL</span><span class="d">아이보리 레터 × 왁스 씰 — 씰을 누르면 봉투가 열림</span></span></a>
  <a class="item" href="holo/"><span class="swatch s3"></span>
    <span class="t"><span class="n">03 · HOLO</span><span class="d">1%CLUB 블루 홀로그램 티켓 — 기울이면 무지개 광택</span></span></a>
  <a class="item" href="velvet/"><span class="swatch s4"></span>
    <span class="t"><span class="n">04 · VELVET</span><span class="d">스피크이지 벨벳 × 브라스 — 길게 눌러 잠금 해제</span></span></a>
  <a class="item" href="editorial/"><span class="swatch s5"></span>
    <span class="t"><span class="n">05 · EDITORIAL</span><span class="d">아이보리 매거진 타이포 — 3D 패럴랙스 레이어</span></span></a>
</div>
<div class="foot">모든 시안의 RSVP는 실제로 작동하며<br>응답은 구글시트에 자동 적재됩니다</div>
</body>
</html>
